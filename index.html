<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Directors Cup</title><style>*{box-sizing:border-box}body{background:#141412;color:#f4eee1;font-family:Georgia,serif;text-align:center;margin:0}main{max-width:800px;margin:auto;padding:40px 16px}h1{font-size:clamp(38px,8vw,70px);font-weight:400;margin:16px 0}p{color:#bcb7ad;line-height:1.5}small{font:11px system-ui;letter-spacing:2px;color:#c4a66e;text-transform:uppercase}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.director{min-height:280px;background:linear-gradient(145deg,#302b22,#1c1c19);border:1px solid #77684c;color:inherit;border-radius:6px;padding:16px 10px;cursor:pointer;font-family:inherit}.director:hover{border-color:#e8c98e}.initial{display:block;font-size:44px;color:#c4a66e}.name{display:block;font-size:clamp(20px,4vw,34px);margin:18px 0}.films{display:block;color:#c9c2b5;font-size:14px;line-height:1.5}.pick{display:block;margin-top:24px;color:#d9b979;font:10px system-ui;letter-spacing:1px}.action{background:transparent;border:1px solid #77684c;color:#e6d6b8;padding:12px;margin:5px;border-radius:4px;cursor:pointer}.action:disabled{opacity:.3}progress{width:100%;height:5px;accent-color:#c4a66e}h2{font-size:clamp(35px,7vw,60px);font-weight:400}details{text-align:left;margin-top:30px;color:#bcb7ad}li{padding:5px}</style><main><small>World cinema · 20 auteurs</small><h1>The Directors Cup</h1><p>Two filmmakers. One choice. Who is your favourite?</p><div id="game"></div><button class="action" id="undo">Undo choice</button><button class="action" id="restart">New tournament</button><details><summary>All 20 directors</summary><ol id="roster"></ol></details></main><script>const d=[["Andrei Tarkovsky","Stalker · Solaris · Mirror"],["Ingmar Bergman","Persona · The Seventh Seal"],["Lars von Trier","Melancholia · Dogville"],["Federico Fellini","8½ · La Dolce Vita"],["Akira Kurosawa","Seven Samurai · Rashomon"],["Stanley Kubrick","2001 · Barry Lyndon"],["David Lynch","Mulholland Drive · Blue Velvet"],["Michael Haneke","Caché · The White Ribbon"],["Krzysztof Kieślowski","Three Colours · Dekalog"],["Béla Tarr","Sátántangó · Werckmeister Harmonies"],["Wong Kar-wai","In the Mood for Love · Chungking Express"],["Michelangelo Antonioni","L’Avventura · Blow-Up"],["Jean-Luc Godard","Breathless · Contempt"],["Abbas Kiarostami","Close-Up · Taste of Cherry"],["Yasujirō Ozu","Tokyo Story · Late Spring"],["Luis Buñuel","Viridiana · The Discreet Charm of the Bourgeoisie"],["Pier Paolo Pasolini","Teorema · The Gospel According to St. Matthew"],["Terrence Malick","The Tree of Life · Days of Heaven"],["Theo Angelopoulos","Eternity and a Day · Landscape in the Mist"],["Agnès Varda","Cléo from 5 to 7 · Vagabond"]];let s,h=[];const g=document.getElementById('game');document.getElementById('roster').innerHTML=d.map(x=>'<li>'+x[0]+'</li>').join('');function start(){let a=d.map((_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}s={q:a.slice(0,8),n:a.slice(8),r:0,c:0};h=[];render()}function choose(i){h.push(JSON.stringify(s));s.n.push(i);s.q.splice(0,2);s.c++;if(!s.q.length){s.q=s.n;s.n=[];s.r++}render()}function render(){document.getElementById('undo').disabled=!h.length;g.innerHTML='<small>'+ (s.c===19?'Tournament complete':['Preliminary round','Round of 16','Quarter-finals','Semi-finals','Final'][s.r])+' · '+s.c+' / 19</small><p><progress max="19" value="'+s.c+'"></progress></p>';if(s.c===19){let x=d[s.q[0]];g.innerHTML+='<small>Your favourite director</small><h2>'+x[0]+'</h2><p>'+x[1]+'</p><button class="action" id="share">Share result</button><p id="feedback"></p>';document.getElementById('share').onclick=async()=>{let t='My Directors Cup winner: '+x[0]+'. Who is yours? '+location.href;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);document.getElementById('feedback').textContent='Copied!'}}catch(e){document.getElementById('feedback').textContent=t}};return}g.innerHTML+='<div class="cards">'+s.q.slice(0,2).map(i=>'<button class="director" data-i="'+i+'"><span class="initial">'+d[i][0].split(' ').map(x=>x[0]).join('')+'</span><span class="name">'+d[i][0]+'</span><span class="films">'+d[i][1]+'</span><span class="pick">CHOOSE DIRECTOR →</span></button>').join('')+'</div>';g.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}document.getElementById('undo').onclick=()=>{if(h.length){s=JSON.parse(h.pop());render()}};document.getElementById('restart').onclick=start;start();</script></html>
